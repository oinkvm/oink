name: Oink
options:
  bundleIdPrefix: com.hachiwii.oink
  developmentLanguage: zh-Hans
  deploymentTarget:
    iOS: '18.0'
settings:
  base:
    # Signed builds pass DEVELOPMENT_TEAM explicitly; no personal signing defaults.
    OINK_BUNDLE_ID: com.hachiwii.oink
    OINK_APP_GROUP: group.com.hachiwii.oink
    OINK_KEYCHAIN_GROUP: $(AppIdentifierPrefix)$(OINK_BUNDLE_ID)
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: 1
    GENERATE_INFOPLIST_FILE: NO
    CODE_SIGN_ENTITLEMENTS: Config/Oink.entitlements
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    INFOPLIST_KEY_CFBundleDisplayName: Oink
    OTHER_LDFLAGS: ['$(inherited)', '-lc++', '-lsqlite3', '-framework', 'AudioToolbox']
targetTemplates:
  Shared:
    platform: iOS
    dependencies:
      - framework: Generated/OinkMobile.xcframework
        embed: false
    sources:
      - Shared
      # Only the generated bindings. Test-only probe sources are copied into
      # Generated/Swift for device gates and must never enter product targets.
      - path: Generated/Swift/oink_mobile_ffi.swift
        optional: true
    settings:
      base:
        APPLICATION_EXTENSION_API_ONLY: YES
        OTHER_SWIFT_FLAGS: ['$(inherited)', '-D', 'OINK_MOBILE_CORE_FFI', '-Xcc', '-fmodule-map-file=$(SRCROOT)/Generated/Swift/oink_mobile_ffiFFI.modulemap']
        HEADER_SEARCH_PATHS: ['$(inherited)', '$(SRCROOT)/Generated/Swift']
        SWIFT_INCLUDE_PATHS: ['$(inherited)', '$(SRCROOT)/Generated/Swift']
targets:
  Oink:
    templates: [Shared]
    type: application
    sources:
      - App
      - Broadcast
      # Control Center / Live Activity intents and the controls' App Group state, shared with
      # OinkControls. Not in the Shared template: the share extension must not declare them.
      - Controls
      # 一键复制's ready-made shortcut, one per tile colour, signed for anyone
      # (Shortcuts/sign-shortcut.sh); ShortcutFile picks the one for the theme accent.
      - path: Shortcuts/OinkCopy-red.shortcut
        buildPhase: resources
      - path: Shortcuts/OinkCopy-darkOrange.shortcut
        buildPhase: resources
      - path: Shortcuts/OinkCopy-violet.shortcut
        buildPhase: resources
      - path: Shortcuts/OinkCopy-darkBlue.shortcut
        buildPhase: resources
      - path: Shortcuts/OinkCopy-teal.shortcut
        buildPhase: resources
      # 开源许可 data generated by build-support/generate-licenses.mjs: this app's entries and the
      # full texts (folder reference, bundled as texts/<sha256>.txt).
      - path: ../../../licenses/mobile-ios.json
        buildPhase: resources
      - path: ../../../licenses/texts
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(OINK_BUNDLE_ID)
        INFOPLIST_FILE: Config/App.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon-pink
        # Alternate icons are compiled into Assets.car only when listed here; actool also
        # writes their CFBundleAlternateIcons entries (keyed by the icon set name).
        ASSETCATALOG_COMPILER_ALTERNATE_APP_ICON_NAMES: AppIcon-orange AppIcon-violet AppIcon-blue AppIcon-teal
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        APPLICATION_EXTENSION_API_ONLY: NO
        SWIFT_OBJC_BRIDGING_HEADER: App/Audio/OinkAudio-Bridging-Header.h
        CLANG_CXX_LANGUAGE_STANDARD: c++17
        HEADER_SEARCH_PATHS: ['$(inherited)', '$(SRCROOT)/../../../crates/oink-mobile-ffi/include']
        OTHER_SWIFT_FLAGS: ['$(inherited)', '-D', 'OINK_MAIN_APP']
    dependencies:
      - target: OinkShare
      - target: OinkControls
      - target: OinkBroadcast
  OinkShare:
    templates: [Shared]
    type: app-extension
    sources:
      - ShareExtension
      # The device picker and the share card draw the app's icons (platform logos,
      # Lucide glyphs). XcodeGen has no target-level `resources:` key (it is ignored
      # without a warning), so the catalog is a source in the resources phase;
      # SharePickerTests checks the generated phase.
      - path: App/Assets.xcassets
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(OINK_BUNDLE_ID).share
        INFOPLIST_FILE: Config/Share.plist
  OinkBroadcast:
    type: app-extension
    platform: iOS
    sources:
      - Broadcast
      - BroadcastExtension
      - Controls/ControlsState.swift
      - Controls/ForwardControlStore.swift
      - Shared/SharedStore.swift
      - Shared/DeviceOnlyStorage.swift
      - Shared/HostPolicy.swift
      - Shared/Models.swift
      - Shared/SystemDeviceName.swift
      - Shared/BonjourDiscovery.swift
      - Shared/UserFacingError.swift
      - Shared/BonjourPublisher.swift
      - Shared/OwnerReleaseSignal.swift
      - path: Generated/Swift/oink_mobile_ffi.swift
        optional: true
    dependencies:
      - framework: Generated/OinkMobile.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(OINK_BUNDLE_ID).broadcast
        INFOPLIST_FILE: Config/Broadcast.plist
        APPLICATION_EXTENSION_API_ONLY: YES
        SWIFT_OBJC_BRIDGING_HEADER: BroadcastExtension/Broadcast-Bridging-Header.h
        CLANG_CXX_LANGUAGE_STANDARD: c++17
        HEADER_SEARCH_PATHS: ['$(inherited)', '$(SRCROOT)/../../../crates/oink-mobile-ffi/include', '$(SRCROOT)/Generated/Swift']
        OTHER_SWIFT_FLAGS: ['$(inherited)', '-D', 'OINK_MOBILE_CORE_FFI', '-Xcc', '-fmodule-map-file=$(SRCROOT)/Generated/Swift/oink_mobile_ffiFFI.modulemap']
        SWIFT_INCLUDE_PATHS: ['$(inherited)', '$(SRCROOT)/Generated/Swift']
  # Control Center toggles 扬声器 / 麦克风 and the audio Live Activities (iOS 18+). No Rust
  # core: the toggles read the App Group state the app writes, and their intents (Controls/)
  # run in the app's process. App Group only (no keychain, no network).
  OinkControls:
    type: app-extension
    platform: iOS
    sources:
      - Controls
      - ControlsExtension
      - Broadcast/OinkBroadcastPipe.mm
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(OINK_BUNDLE_ID).controls
        INFOPLIST_FILE: Config/Controls.plist
        CODE_SIGN_ENTITLEMENTS: Config/Controls.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: Controls/Controls-Bridging-Header.h
        CLANG_CXX_LANGUAGE_STANDARD: c++17
        APPLICATION_EXTENSION_API_ONLY: YES
  OinkAudioTestHost:
    type: application
    platform: iOS
    sources:
      - App/Audio
      - Broadcast/OinkBroadcastPipe.h
      - Broadcast/OinkBroadcastPipe.mm
      - Broadcast/ForwardDriver.swift
      - Tests/AudioTestHost.swift
      # ShareStatusFormatter is a shared data formatter used by the audio
      # test bundle; keep its implementation in the host module so tests do
      # not duplicate or reimplement UI formatting semantics.
      - Shared/Models.swift
      - Shared/SystemDeviceName.swift
      # Typed transfer failure texts, tested by TransferFailureTextTests.
      - Shared/TransferFailureText.swift
      # Folder pages and failed listings (FolderListingsTests).
      - Shared/FolderListings.swift
      # Which session the pairing sheet opens, tested without the UI.
      - Shared/PairingInbox.swift
      # The transfer page's copy writer, tested against a named pasteboard.
      - App/PasteboardCopy.swift
      # The viewer's sequence (Quick Look paging rules).
      - App/QuickLookSequence.swift
      # The one-tap copy shortcut's result mapping, and staging its bundled file.
      - Shared/LatestClip.swift
      - App/ShortcutFile.swift
      # Control Center toggles' App Group state, liveness lock and Live Activity texts.
      - Controls/ControlsState.swift
      - Controls/ForwardControlStore.swift
      - App/SpeakerActions.swift
      # Control page key rules and touchpad recognizer (pure logic, no UI).
      - App/Control/ControlKeys.swift
      - App/Control/KeySlide.swift
      - App/Control/TrackpadRecognizer.swift
      - App/Control/ControlRequests.swift
      - App/Control/ControlLayout.swift
      - App/Control/ControlFloat.swift
      # PC text field focus → open the keyboard (protocol-v2 §14.7).
      - App/Control/PCTextFocus.swift
      # The system keyboard's hidden field: mirror to the focus computer, restart rules, OinkIme log.
      - App/Control/RemoteInputField.swift
      # Transfer page layout rules (batches, folding, composer prompt).
      - App/TransferLayout.swift
      # Share device picker rules (phone-to-phone).
      - Shared/SharePickerModel.swift
      # The text formats a shared item is sent with (plain text, HTML, RTF).
      - Shared/ShareText.swift
      - Shared/ShareStaging.swift
      - Shared/ShareSummary.swift
      # Share card stage maths (share-anim SPEC key frames).
      - Shared/ShareAnim.swift
      # Session lifecycle decisions and the list thumbnails (review fixes).
      - Shared/HostPolicy.swift
      - Shared/SessionLifecycle.swift
      - App/ImageThumbnails.swift
      # Backup exclusion of the group and pairing files.
      - Shared/DeviceOnlyStorage.swift
      # Settings › 清理传输记录 (row state, confirm, toast).
      - Shared/TransferHistoryClear.swift
      - Shared/UserFacingError.swift
      # Transfer history model (record changes from the session), with its DEBUG fixtures.
      - Shared/TransferStore.swift
      # Rich text bubbles: the parsed markup, layout numbers, and the DEBUG design states.
      - Shared/RichText.swift
      - Shared/TransferRichFixture.swift
      - Shared/DesignScene.swift
      - Shared/TransferPerfFixture.swift
      - path: Generated/Swift/oink_mobile_ffi.swift
        optional: true
    dependencies:
      - framework: Generated/OinkMobile.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hachiwii.oink.audio-tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: ''
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        SWIFT_OBJC_BRIDGING_HEADER: App/Audio/OinkAudio-Bridging-Header.h
        CLANG_CXX_LANGUAGE_STANDARD: c++17
        HEADER_SEARCH_PATHS: ['$(inherited)', '$(SRCROOT)/../../../crates/oink-mobile-ffi/include']
        OTHER_SWIFT_FLAGS: ['$(inherited)', '-D', 'OINK_MOBILE_CORE_FFI', '-Xcc', '-fmodule-map-file=$(SRCROOT)/Generated/Swift/oink_mobile_ffiFFI.modulemap']
        SWIFT_INCLUDE_PATHS: ['$(inherited)', '$(SRCROOT)/Generated/Swift']
  OinkAudioTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/BroadcastTests.swift
      - Tests/AudioLifecycleTests.swift
      - Tests/ShareStatusFormatterTests.swift
      - Tests/SystemDeviceNameTests.swift
      - Tests/PasteboardCopyTests.swift
      - Tests/QuickLookSequenceTests.swift
      - Tests/PairingInboxTests.swift
      - Tests/LatestClipTests.swift
      - Tests/TransferFailureTextTests.swift
      - Tests/FolderListingsTests.swift
      - Tests/ControlInputTests.swift
      - Tests/ControlLayoutTests.swift
      - Tests/ControlFloatTests.swift
      - Tests/PCTextFocusTests.swift
      - Tests/RemoteInputFieldTests.swift
      - Tests/KeySlideTests.swift
      - Tests/TransferLayoutTests.swift
      - Tests/RichTextTests.swift
      - Tests/SharePickerTests.swift
      - Tests/ShareTextTests.swift
      - Tests/ShareWaitingTests.swift
      - Tests/ShareAnimTests.swift
      - Tests/HostPolicyTests.swift
      - Tests/DeviceOnlyStorageTests.swift
      - Tests/TransferHistoryClearTests.swift
      - Tests/TransferModelTests.swift
      - Tests/ToolbarAudioTests.swift
      - Tests/ControlsStateTests.swift
      - Tests/SpeakerActionsTests.swift
      - Tests/ShortcutFileTests.swift
      - Tests/AudioSystemStub.mm
    dependencies:
      - target: OinkAudioTestHost
      - framework: Generated/OinkMobile.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hachiwii.oink.audio-tests.bundle
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: ''
        SWIFT_OBJC_BRIDGING_HEADER: Tests/AudioTests-Bridging-Header.h
        CLANG_CXX_LANGUAGE_STANDARD: c++17
        OTHER_SWIFT_FLAGS: ['$(inherited)', '-D', 'OINK_MOBILE_CORE_FFI', '-Xcc', '-fmodule-map-file=$(SRCROOT)/Generated/Swift/oink_mobile_ffiFFI.modulemap']
        HEADER_SEARCH_PATHS: ['$(inherited)', '$(SRCROOT)/Generated/Swift', '$(SRCROOT)/../../../crates/oink-mobile-ffi/include']
        SWIFT_INCLUDE_PATHS: ['$(inherited)', '$(SRCROOT)/Generated/Swift']
  # Simulator UI tests of the control page on the DEBUG design fixtures (`-oink-ui-scene`).
  OinkUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Oink
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hachiwii.oink.ui-tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: ''
        TEST_TARGET_NAME: Oink

schemes:
  Oink:
    build:
      targets:
        Oink: all

  OinkUITests:
    build:
      targets:
        Oink: all
        OinkUITests: [test]
    test:
      targets:
        - name: OinkUITests
          parallelizable: false

  OinkAudioTests:
    build:
      targets:
        OinkAudioTestHost: all
    test:
      targets:
        - name: OinkAudioTests
          parallelizable: false
