[package]
name = "oink-audio"
description = "系统音频采集、低延迟传输与多路播放"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
oink-foundation.workspace = true
oink-protocol.workspace = true
thiserror.workspace = true
tracing.workspace = true
serde.workspace = true
cpal = "0.17.3"
opus = "=0.4.0"
serde_json = "1"
fs2 = "0.4"
crossbeam-queue = "0.3"

[build-dependencies]
cc = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Media_Control", "Foundation_Collections", "Win32_System_WinRT", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_Security", "Win32_System_Performance", "Win32_System_Power", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }

windows-core = "0.62"

[lints]
workspace = true

[dev-dependencies]
tempfile = "3"
tracing-subscriber = "0.3"
tokio.workspace = true
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
quinn-proto = { version = "0.11", default-features = false }
bytes = "1"
libc = "0.2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging", "tls12"] }
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
