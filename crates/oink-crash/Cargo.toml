[package]
name = "oink-crash"
description = "Local-only numeric crash capture and attributed projection"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
[dependencies]
oink-telemetry.workspace = true
serde.workspace = true
serde_json.workspace = true
getrandom = "0.3"
time = { version = "0.3", features = ["parsing"] }
[target.'cfg(unix)'.dependencies]
libc = "0.2"
[target.'cfg(windows)'.dependencies]
# minidump's prost/procfs-core and minidump-unwind's breakpad-symbols/async-trait
# are mandatory upstream dependencies (neither crate defines default features).
# Only offline PE unwinding is enabled; no HTTP supplier or name symbolication.
object = { version = "0.36", default-features = false, features = ["read_core", "pe", "std"] }
minidump = { version = "=0.26.1", default-features = false }
minidump-unwind = { version = "=0.26.1", default-features = false, features = ["debuginfo-unwind"] }
futures-executor = { version = "0.3", default-features = false, features = ["std"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_Debug", "Win32_System_Threading", "Win32_System_Kernel", "Win32_System_Memory", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_Console", "Win32_System_IO", "Win32_Security", "Wdk_System_SystemServices", "Win32_System_SystemInformation"] }
# The real macOS .ips child test reads its Mach-O text extent. This parser is
# test-only on macOS; production .ips extraction reads the bounded header itself.
[target.'cfg(target_os = "macos")'.dev-dependencies]
object = { version = "0.36", default-features = false, features = ["read_core", "macho", "std"] }
[dev-dependencies]
tempfile = "3"
[lints]
workspace = true
