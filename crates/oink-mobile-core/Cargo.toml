[package]
name = "oink-mobile-core"
description = "Platform-independent mobile transfer history and routing core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
oink-foundation.workspace = true
oink-audio.workspace = true
oink-network.workspace = true
oink-protocol.workspace = true
oink-routing.workspace = true
rand = "0.8"
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tempfile = "3"
zip = { version = "9.0", default-features = false }

[features]
# Test hooks for dependent crates' tests (network-layer failure injection).
test-support = ["oink-network/test-support"]

[dev-dependencies]
tracing-subscriber.workspace = true
# Network-layer failure injection in this crate's own tests.
oink-network = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
