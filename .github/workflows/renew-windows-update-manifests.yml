name: Renew Windows update manifests
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  gate:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.repository_owner == 'oinkvm'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      enabled: ${{ steps.catalog.outputs.enabled }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - id: gate
        run: |
          enabled=$(python3 build-support/update/feed_site.py enabled --platform windows --config-only)
          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"
          if [ "$enabled" = false ]; then echo 'Windows feed disabled; renewal skipped.' >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        if: steps.gate.outputs.enabled == 'true'
        with:
          ref: update-feed-state
          path: feed-state
          persist-credentials: false
      - id: catalog
        if: steps.gate.outputs.enabled == 'true'
        run: |
          enabled=$(python3 build-support/update/feed_site.py enabled --platform windows --require-catalog)
          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"
          if [ "$enabled" = false ]; then echo 'Windows feed disabled; renewal skipped.' >> "$GITHUB_STEP_SUMMARY"; fi
  sign:
    needs: gate
    if: needs.gate.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    environment: release
    concurrency:
      group: oink-update-feed-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: update-feed-state
          path: feed-state
          token: ${{ secrets.UPDATE_FEED_WRITER_TOKEN }}
      - name: Validate unchanged Windows catalog and durably reserve sequences
        run: |
          python3 build-support/update/feed.py allocate
          python3 build-support/update/reserve.py
      - name: Sign exact reserved bytes
        env:
          WINDOWS_UPDATE_ED25519_PEM_WIN_2026_01: ${{ secrets.WINDOWS_UPDATE_ED25519_PEM_WIN_2026_01 }}
        run: |
          python3 build-support/update/feed.py sign
          python3 build-support/update/feed_site.py candidate --platform windows --output windows-candidate
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: renewed-windows-feed
          path: windows-candidate
          retention-days: 2
  deploy:
    needs: sign
    uses: ./.github/workflows/deploy-feed.yml
    with:
      platform: windows
      artifact: renewed-windows-feed
    secrets:
      UPDATE_FEED_WRITER_TOKEN: ${{ secrets.UPDATE_FEED_WRITER_TOKEN }}
