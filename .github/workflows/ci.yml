name: Build and test
run-name: ${{ inputs.reserve_only && format('Oink build reservation {0}', inputs.request_id) || format('Build {0}', github.ref_name) }}
on:
  pull_request:
  push:
    branches: [main, '0.4']
  workflow_dispatch:
    inputs:
      reserve_only:
        description: Reserve a shared number for a local in-house build; do not compile
        type: boolean
        default: false
      request_id:
        description: Random reservation request id (local helper)
        type: string
permissions:
  contents: read
concurrency:
  group: ci-${{ inputs.reserve_only && github.run_id || github.ref }}
  cancel-in-progress: true
env:
  # Branch builds compile products without invoking the full test/policy suite.
  BUILD_ONLY: ${{ github.ref == 'refs/heads/0.4' || github.base_ref == '0.4' }}
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  PYTHONUTF8: '1'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  MACOSX_DEPLOYMENT_TARGET: '14.2'
  CMAKE_POLICY_VERSION_MINIMUM: '3.5'
jobs:
  platforms:
    if: github.ref != 'refs/heads/0.4' && !inputs.reserve_only
    strategy:
      fail-fast: false
      matrix:
        include:
          # Only Windows x64 and Mac arm64 block a release. Every other target
          # (Mac x64 now, later ones such as Windows arm64) still runs and is
          # reported, but its failure does not fail the run.
          - os: macos-15
            target: aarch64-apple-darwin
            jobs: '2'
            blocking: true
          - os: macos-15-intel
            target: x86_64-apple-darwin
            jobs: '2'
            blocking: false
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            jobs: '4'
            blocking: true
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ !matrix.blocking }}
    timeout-minutes: 120
    env:
      CARGO_BUILD_TARGET: ${{ matrix.target }}
      CARGO_BUILD_JOBS: ${{ matrix.jobs }}
      RUST_TEST_THREADS: '4'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: '1.99.0'
          components: rustfmt, clippy
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.target }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14.6'
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24.14.1'
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4
        with:
          path: |
            ~/.cargo/bin/cargo-about*
            ~/.cargo/bin/cargo-deny*
          key: policy-tools-${{ runner.os }}-${{ runner.arch }}-rust1.99.0-about0.9.2-deny0.20.2
      - name: Assert product architecture and pin npm
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == macOS ]]; then test "$(uname -m)" = "${{ matrix.target == 'aarch64-apple-darwin' && 'arm64' || 'x86_64' }}"; fi
          if [[ "$RUNNER_OS" == Windows ]]; then test "$PROCESSOR_ARCHITECTURE" = AMD64; fi
          npm install --global npm@11.11.0
      - name: Select OpenSSL 3 for macOS feed tests
        if: runner.os == 'macOS' && env.BUILD_ONLY != 'true'
        shell: bash
        run: |
          # Apple's LibreSSL cannot perform the Ed25519 pkeyutl -rawin calls.
          openssl_bin="$(brew --prefix openssl@3)/bin"
          export PATH="$openssl_bin:$PATH"
          echo "$openssl_bin" >> "$GITHUB_PATH"
          openssl version
          if ! openssl version | grep -q '^OpenSSL 3\.'; then
            echo '::error::OpenSSL 3.x is required for feed signature tests'
            exit 1
          fi
      - name: Frontend and attribution
        shell: bash
        run: |
          npm ci
          npm run -w apps/oink typecheck
          if [[ "$BUILD_ONLY" != true ]]; then npm run -w apps/oink test; fi
          npm run -w apps/oink build
          if [[ "$BUILD_ONLY" == true ]]; then exit 0; fi
          if ! cargo about --version 2>/dev/null | grep -q '0.9.2$'; then cargo install cargo-about --version 0.9.2 --locked --features cli; fi
          npm run licenses:check -- --release-sources
      - name: File Provider compile and pure tests
        if: runner.os == 'macOS'
        shell: bash
        run: |
          args=()
          if [[ "$BUILD_ONLY" != true ]]; then args+=(--test); fi
          python packaging/macos/check.py "${args[@]}"
      - name: Rust formatting
        run: cargo fmt --all --check
      - name: Desktop Rust build
        if: env.BUILD_ONLY == 'true'
        run: cargo build --locked --workspace
      - name: All targets, integration and release parser tests
        if: env.BUILD_ONLY != 'true'
        shell: bash
        run: |
          python build-support/ci.py
      - name: Packaging pure tests
        if: env.BUILD_ONLY != 'true'
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == Windows ]]; then export PATH="/c/Program Files/Git/usr/bin:$PATH"; fi
          openssl version
          python -m unittest discover -s packaging/tests -v
      - name: Compile and inspect Windows MSI without installation
        if: runner.os == 'Windows' && env.BUILD_ONLY != 'true'
        run: python build-support/package.py --public-version --platform windows --sequence 1 --output-root "${{ runner.temp }}/package-check"
      - name: Dependency policy
        if: env.BUILD_ONLY != 'true'
        shell: bash
        run: |
          if ! cargo deny --version 2>/dev/null | grep -q '0.20.2$'; then cargo install cargo-deny --version 0.20.2 --locked; fi
          cargo deny check

  android:
    needs: beta-plan
    if: github.ref == 'refs/heads/0.4' && !inputs.reserve_only
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            target: aarch64-linux-android
            blocking: false
          - abi: x86_64
            target: x86_64-linux-android
            blocking: false
    runs-on: ubuntu-24.04
    continue-on-error: ${{ !matrix.blocking }}
    timeout-minutes: 90
    environment: release
    env:
      OINK_PACKAGE_CHANNEL: beta
      MOBILE_PROFILE: debug
      MOBILE_ANDROID_ABIS: ${{ matrix.abi }}
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: '1.99.0'
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: android-${{ matrix.target }}
          workspaces: |
            . -> target
            build-support/mobile/uniffi-bindgen -> target/uniffi-bindgen
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
      - name: Install the app's pinned Android SDK
        shell: bash
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;37.0.0' 'ndk;30.0.16248370'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked
      - name: Build Rust core and Kotlin bindings
        run: bash build-support/mobile/build-android.sh
      - name: Restore the existing in-house Android signing key
        env:
          OINK_ANDROID_KEYSTORE_BASE64: ${{ secrets.OINK_ANDROID_KEYSTORE_BASE64 }}
          OINK_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.OINK_ANDROID_KEYSTORE_PASSWORD }}
          OINK_ANDROID_KEY_ALIAS: ${{ secrets.OINK_ANDROID_KEY_ALIAS }}
          OINK_ANDROID_KEY_PASSWORD: ${{ secrets.OINK_ANDROID_KEY_PASSWORD }}
        run: python3 build-support/android_signing.py prepare
      - name: Assemble APK signed by the existing in-house key
        env:
          OINK_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.OINK_ANDROID_KEYSTORE_PASSWORD }}
          OINK_ANDROID_KEY_ALIAS: ${{ secrets.OINK_ANDROID_KEY_ALIAS }}
          OINK_ANDROID_KEY_PASSWORD: ${{ secrets.OINK_ANDROID_KEY_PASSWORD }}
        run: bash apps/mobile/android/gradlew -p apps/mobile/android --no-daemon :app:assembleDebug -PoinkBuild=${{ needs.beta-plan.outputs.build }} -PoinkChannel=beta -PoinkAbis=${{ matrix.abi }}
      - name: Verify APK version and ABI and stage installer
        run: python3 build-support/beta_draft.py stage --target android-${{ matrix.abi }} --apk apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk --aapt2 "$ANDROID_HOME/build-tools/37.0.0/aapt2" --output "$RUNNER_TEMP/beta"
      - name: Verify the APK has the same signing certificate as in-house
        run: python3 build-support/android_signing.py verify --apk apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk --apksigner "$ANDROID_HOME/build-tools/37.0.0/apksigner" --output "$RUNNER_TEMP/beta/android-signature.json"
      - name: Remove ephemeral Android signing material
        if: always()
        run: python3 build-support/android_signing.py cleanup
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: beta-android-${{ matrix.abi }}
          path: ${{ runner.temp }}/beta/*
          if-no-files-found: error

  beta-plan:
    if: github.repository == 'oinkvm/oink' && github.ref == 'refs/heads/0.4'
    runs-on: ubuntu-24.04
    outputs:
      sequence: ${{ steps.plan.outputs.sequence }}
      build: ${{ steps.plan.outputs.build }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Allocate this run's shared sequence
        id: plan
        env:
          RESERVE_ONLY: ${{ inputs.reserve_only }}
          REQUEST_ID: ${{ inputs.request_id }}
        run: python3 build-support/beta_draft.py plan --output "$RUNNER_TEMP/reservation"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: inputs.reserve_only
        with:
          name: build-reservation
          path: ${{ runner.temp }}/reservation/build-reservation.json
          if-no-files-found: error

  desktop-packages:
    needs: beta-plan
    if: github.repository == 'oinkvm/oink' && github.ref == 'refs/heads/0.4' && !inputs.reserve_only
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: macos
            arch: arm64
            target: aarch64-apple-darwin
            package: macos-arm64
            jobs: '2'
            blocking: true
          - os: macos-15-intel
            platform: macos
            arch: x64
            target: x86_64-apple-darwin
            package: macos-x64
            jobs: '2'
            blocking: false
          - os: windows-2022
            platform: windows
            arch: x64
            target: x86_64-pc-windows-msvc
            package: windows-x64
            jobs: '4'
            blocking: true
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ !matrix.blocking }}
    timeout-minutes: 120
    environment: release
    env:
      CARGO_BUILD_JOBS: ${{ matrix.jobs }}
      OINK_PACKAGE_CHANNEL: beta
      OINK_REPORT_REGION: eu
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: '1.99.0'
          components: rustfmt
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: beta-${{ matrix.target }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14.6'
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24.14.1'
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4
        with:
          path: |
            ~/.cargo/bin/cargo-about*
            ${{ runner.temp }}/package-tools
          key: release-tools-${{ runner.os }}-${{ runner.arch }}-rust1.99.0-about0.9.2-wix5.0.2-sparkle2.9.6
      - name: Pin build tools and check formatting
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == macOS ]]; then test "$(uname -m)" = "${{ matrix.arch == 'arm64' && 'arm64' || 'x86_64' }}"; fi
          npm install --global npm@11.11.0
          if ! cargo about --version 2>/dev/null | grep -q '0.9.2$'; then cargo install cargo-about --version 0.9.2 --locked --features cli; fi
          cargo fmt --all --check
          npm ci
          npm run -w apps/oink typecheck
      - name: Prepare existing Mac signing and notarization credentials
        if: runner.os == 'macOS'
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_FINGERPRINT: ${{ vars.MACOS_SIGNING_FINGERPRINT }}
          APPLE_NOTARY_KEY_P8: ${{ secrets.APPLE_NOTARY_KEY_P8 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER }}
        run: python packaging/macos/ci-keychain.py
      - name: Use TCP for Apple ticket delivery on hosted Macs
        if: runner.os == 'macOS' && runner.environment == 'github-hosted'
        shell: bash
        run: |
          echo 'block return out quick proto udp from any to any port 443' | sudo pfctl -f -
          sudo pfctl -E
      - name: Build and audit beta installers (without full test suites)
        shell: bash
        env:
          OINK_REPORT_DSN: ${{ secrets.OINK_REPORT_DSN }}
          MACOS_SIGNING_FINGERPRINT: ${{ vars.MACOS_SIGNING_FINGERPRINT }}
          SEQUENCE: ${{ needs.beta-plan.outputs.sequence }}
        run: |
          args=()
          if [[ "$RUNNER_OS" == macOS ]]; then
            args+=(--arch "${{ matrix.arch }}" --notary-profile release-notary --notary-keychain "$RUNNER_TEMP/release-signing/signing.keychain-db" --notary-timeout 1200)
          fi
          python build-support/package.py --beta --platform "${{ matrix.platform }}" --sequence "$SEQUENCE" --output-root "$RUNNER_TEMP/packages" --tool-cache "$RUNNER_TEMP/package-tools" "${args[@]}"
          python build-support/beta_draft.py stage --target "${{ matrix.package }}" --packages "$RUNNER_TEMP/packages" --output "$RUNNER_TEMP/beta"
      - name: Remove ephemeral signing material
        if: always() && runner.os == 'macOS'
        run: python packaging/macos/ci-keychain.py cleanup
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: beta-${{ matrix.package }}
          path: ${{ runner.temp }}/beta/*
          if-no-files-found: error

  beta-draft:
    needs: [beta-plan, desktop-packages, android]
    if: ${{ !cancelled() && github.repository == 'oinkvm/oink' && github.ref == 'refs/heads/0.4' && !inputs.reserve_only && needs.beta-plan.result == 'success' && needs.desktop-packages.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: beta-*
          path: ${{ runner.temp }}/downloaded
      - name: Verify source/version/integrity and create only a draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 build-support/beta_draft.py publish --downloads "$RUNNER_TEMP/downloaded" --output "$RUNNER_TEMP/draft"
