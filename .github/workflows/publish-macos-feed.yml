name: Publish macOS feed
on:
  workflow_call:
    inputs:
      artifact:
        description: This run's approved offline-signed site/mac and catalog.json
        required: true
        type: string
      qualified_build:
        required: true
        type: string
    secrets:
      UPDATE_FEED_WRITER_TOKEN:
        required: true
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  gate:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.repository_owner == 'oinkvm'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      enabled: ${{ steps.gate.outputs.enabled }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - id: gate
        run: |
          enabled=$(python3 build-support/update/feed_site.py enabled --platform mac --config-only)
          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"
  candidate:
    needs: gate
    if: needs.gate.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment: macos-update-publishing
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: update-feed-state
          path: feed-state
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ inputs.artifact }}
          path: mac-input
      - name: Verify signed appcast, packages and qualified catalog
        env:
          OINK_UPDATE_QUALIFIED_BUILD: ${{ inputs.qualified_build }}
        run: |
          cp -R mac-input/site/mac feed-state/site/
          python3 build-support/update/feed_site.py candidate --platform mac --catalog mac-input/catalog.json --output mac-candidate
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-macos-feed
          path: mac-candidate
          retention-days: 2
  deploy:
    needs: candidate
    uses: ./.github/workflows/deploy-feed.yml
    with:
      platform: mac
      artifact: verified-macos-feed
    secrets:
      UPDATE_FEED_WRITER_TOKEN: ${{ secrets.UPDATE_FEED_WRITER_TOKEN }}
