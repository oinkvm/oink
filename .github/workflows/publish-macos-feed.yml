name: Publish macOS feed
on:
  workflow_call:
    inputs:
      release_tag:
        description: Published stable release; never a draft or arbitrary artifact
        required: true
        type: string
    secrets:
      SPARKLE_ED25519_PRIVATE_KEY:
        description: Supplied by the sign job's release environment
        required: true
      UPDATE_FEED_WRITER_TOKEN:
        required: true
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  gate:
    if: github.repository == 'oinkvm/oink' && ((github.event_name == 'release' && github.event.action == 'published' && !github.event.release.draft && !github.event.release.prerelease) || (github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      enabled: ${{ steps.gate.outputs.enabled }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - id: gate
        run: |
          enabled=$(python3 build-support/update/feed_site.py enabled --platform mac --config-only)
          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"
  sign:
    needs: gate
    if: needs.gate.outputs.enabled == 'true'
    runs-on: macos-15
    environment: release
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      build: ${{ steps.sign.outputs.build }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: update-feed-state
          path: feed-state
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14.6'
      - name: Select OpenSSL 3
        run: |
          echo "$(brew --prefix openssl@3)/bin" >> "$GITHUB_PATH"
          "$(brew --prefix openssl@3)/bin/openssl" version | grep '^OpenSSL 3\.'
      - name: Use TCP for Apple ticket delivery on hosted Macs
        if: runner.environment == 'github-hosted'
        run: |
          # Same CloudKit HTTP/3 workaround as package signing; this VM only.
          echo 'block return out quick proto udp from any to any port 443' | sudo pfctl -f -
          sudo pfctl -E
      - name: Verify published source/native package; sign archive and stable appcast
        id: sign
        env:
          GH_TOKEN: ${{ github.token }}
          SPARKLE_ED25519_PRIVATE_KEY: ${{ secrets.SPARKLE_ED25519_PRIVATE_KEY }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: python build-support/update/mac_release.py --release-tag "$RELEASE_TAG" --tool-cache "$RUNNER_TEMP/sparkle"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signed-macos-feed
          path: mac-input
          retention-days: 2
  candidate:
    needs: sign
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment: macos-update-publishing
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: update-feed-state
          path: feed-state
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: signed-macos-feed
          path: mac-input
      - name: Verify signed appcast, packages and qualified catalog
        env:
          OINK_UPDATE_QUALIFIED_BUILD: ${{ needs.sign.outputs.build }}
        run: |
          cp -R mac-input/site/mac feed-state/site/
          python3 build-support/update/feed_site.py candidate --platform mac --catalog mac-input/catalog.json --output mac-candidate
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-macos-feed
          path: mac-candidate
          retention-days: 2
  deploy:
    needs: candidate
    uses: ./.github/workflows/deploy-feed.yml
    with:
      platform: mac
      artifact: verified-macos-feed
    secrets:
      UPDATE_FEED_WRITER_TOKEN: ${{ secrets.UPDATE_FEED_WRITER_TOKEN }}
