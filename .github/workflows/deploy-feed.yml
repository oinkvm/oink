name: Deploy verified platform feed
on:
  workflow_call:
    inputs:
      platform:
        required: true
        type: string
      artifact:
        required: true
        type: string
    secrets:
      UPDATE_FEED_WRITER_TOKEN:
        required: true
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    if: github.repository == 'oinkvm/oink' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || (github.event_name == 'release' && github.event.action == 'published' && !github.event.release.draft && !github.event.release.prerelease))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: github-pages
    concurrency:
      group: oink-update-feed-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: update-feed-state
          path: feed-state
          token: ${{ secrets.UPDATE_FEED_WRITER_TOKEN }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ inputs.artifact }}
          path: candidate-state
      - name: Merge into latest protected snapshot and fence state revision
        env:
          PLATFORM: ${{ inputs.platform }}
        run: python3 build-support/update/deploy.py prepare
      - name: Preserve exact prior deployment for rollback
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          name: previous-feed-${{ inputs.platform }}
          path: feed-state/site
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          name: next-feed-${{ inputs.platform }}
          path: next-state/site
      - name: Deploy complete merged snapshot
        id: publish
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        with:
          artifact_name: next-feed-${{ inputs.platform }}
      - name: Read back custom domain and commit state with CAS
        id: commit
        run: python3 build-support/update/deploy.py commit
      - name: Restore previous hosted bytes on deployment, readback or CAS failure
        if: ${{ always() && (steps.publish.outcome == 'failure' || steps.publish.outcome == 'cancelled' || (steps.publish.outcome == 'success' && steps.commit.outcome != 'success')) }}
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        with:
          artifact_name: previous-feed-${{ inputs.platform }}
      - name: Verify rollback bytes
        if: ${{ always() && (steps.publish.outcome == 'failure' || steps.publish.outcome == 'cancelled' || (steps.publish.outcome == 'success' && steps.commit.outcome != 'success')) }}
        run: python3 build-support/update/deploy.py verify-rollback
      - name: Failure summary
        if: failure()
        run: echo 'Feed transaction failed. Check rollback result; no candidate is marked deployed without public readback and state CAS.' >> "$GITHUB_STEP_SUMMARY"
