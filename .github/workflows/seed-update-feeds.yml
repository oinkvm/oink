name: Seed published stable release feeds
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Already-published stable release tag (for example v0.1.1)
        required: true
        type: string
      platform:
        description: Platforms to publish; select one only to recover an uncommitted feed
        required: true
        type: choice
        default: both
        options: [both, mac, windows]
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  published:
    if: github.repository == 'oinkvm/oink' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Require a live published stable release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          PLATFORM: ${{ inputs.platform }}
        run: |
          case "$PLATFORM" in both|mac|windows) ;; *) echo 'Invalid platform'; exit 1 ;; esac
          python3 build-support/update/published_release.py --release-tag "$RELEASE_TAG"
  macos:
    needs: published
    if: inputs.platform != 'windows'
    uses: ./.github/workflows/publish-macos-feed.yml
    with:
      release_tag: ${{ inputs.release_tag }}
    secrets:
      UPDATE_FEED_WRITER_TOKEN: ${{ secrets.UPDATE_FEED_WRITER_TOKEN }}
      SPARKLE_ED25519_PRIVATE_KEY: ${{ secrets.SPARKLE_ED25519_PRIVATE_KEY }}
  windows:
    needs: published
    if: inputs.platform != 'mac'
    uses: ./.github/workflows/publish-windows-feed.yml
    with:
      release_tag: ${{ inputs.release_tag }}
    secrets:
      UPDATE_FEED_WRITER_TOKEN: ${{ secrets.UPDATE_FEED_WRITER_TOKEN }}
      WINDOWS_UPDATE_ED25519_PEM_WIN_2026_01: ${{ secrets.WINDOWS_UPDATE_ED25519_PEM_WIN_2026_01 }}
