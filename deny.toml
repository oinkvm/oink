# GPL-3.0-only first-party code. Every dependency expression is evaluated in full.
[graph]
all-features = true
# Audit the complete runtime/build/test graphs for the two shipped targets.
targets = ["aarch64-apple-darwin", "x86_64-pc-windows-msvc"]

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
include-dev = true
include-build = true
confidence-threshold = 0.93
allow = [
    "GPL-3.0-only",
    "MIT", "MIT-0", "Apache-2.0", "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib",
    "Unicode-3.0", "Unicode-DFS-2016", "CC0-1.0", "Unlicense",
    "BSL-1.0", "CDLA-Permissive-2.0",
]
# MPL, LGPL and custom licenses require component-specific compatibility review.
# An SPDX OR selects a permitted branch; AND must satisfy every requirement.

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[[licenses.exceptions]]
name = "cssparser"
version = "=0.37.0"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
name = "cssparser-macros"
version = "=0.7.1"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
name = "dtoa-short"
version = "=0.3.5"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
name = "option-ext"
version = "=0.2.0"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
name = "selectors"
version = "=0.38.0"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
name = "minicbor"
version = "=2.3.0"
allow = ["BlueOak-1.0.0"]

# Native HAL dependency; audited separately by the native inventory generator.
[[licenses.exceptions]]
name = "libASPL"
version = "=3.1.2"
allow = ["AML"]
